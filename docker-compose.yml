services:
  music-lounge:
    build: .
    container_name: music-lounge-app
    ports:
      - "8000:5000"
    environment:
      - FLASK_ENV=development
    volumes:
      - .:/app
    restart: always

  ytdlp-api:
    build:
      context: ./ytdlp_server
      dockerfile: Dockerfile
    container_name: ytdlp-api-server
    ports:
      - "8001:5000"
    environment:
      - FLASK_ENV=development
    volumes:
      - ./ytdlp_server:/app
    restart: always
