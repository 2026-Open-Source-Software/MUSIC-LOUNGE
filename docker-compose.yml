version: '3.8'

services:
  music-lounge-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: music-lounge-app
    ports:
      - "8000:5000"
    volumes:
      - .:/app
      - sqlite_data:/app/data
    environment:
      - FLASK_ENV=development

volumes:
  sqlite_data:
