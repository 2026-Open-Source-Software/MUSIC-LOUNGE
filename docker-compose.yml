services:
  web:
    build: .
    container_name: music-lounge-app
    ports:
      - "8000:5000"
    environment:
      - FLASK_ENV=development
      - YTDLP_SERVER_URL=http://ytdlp-server:5001
      - MUSIC_LOUNGE_DB=/app/instance/lounge.sqlite3
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gemma4}
      - OLLAMA_TIMEOUT=300
    volumes:
      - .:/app
      - db_data:/app/instance
    depends_on:
      - ytdlp-server
      - db
      - ollama
    restart: always

  ytdlp-server:
    build: ./ytdlp_server
    container_name: music-lounge-ytdlp
    ports:
      - "5001:5001"
    restart: always

  db:
    image: alpine:latest
    container_name: music-lounge-db
    volumes:
      - db_data:/data
    command: tail -f /dev/null
    restart: always

  ollama:
    image: ollama/ollama:0.40.16
    container_name: music-lounge-ollama
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: always

  # 처음 한 번 모델을 내려받고 종료합니다. 이미 받은 모델은 볼륨에 남아 다시 받지 않습니다.
  ollama-pull:
    image: ollama/ollama:0.40.16
    container_name: music-lounge-ollama-pull
    environment:
      - OLLAMA_HOST=ollama:11434
    entrypoint: ["ollama", "pull"]
    command: ["${OLLAMA_MODEL:-gemma4}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

volumes:
  db_data:
  ollama_models:
