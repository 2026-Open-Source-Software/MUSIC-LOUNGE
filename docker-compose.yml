version: '3.8'

services:
  frontend:
    image: nginx:alpine
    container_name: music_frontend
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

  backend:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: music_backend
    ports:
      - "5000:5000"
    volumes:
      - sqlite_data:/app/instance
    environment:
      - FLASK_ENV=development
    depends_on:
      - db

  db:
    image: alpine:latest
    container_name: music_db
    volumes:
      - sqlite_data:/data
    command: ["sh", "-c", "echo 'Database volume container initialized' && tail -f /dev/null"]

volumes:
  sqlite_data: