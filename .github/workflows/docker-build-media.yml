name: 미디어 서버 이미지 빌드 검사

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-media:
    name: ytdlp_server Dockerfile 빌드
    runs-on: ubuntu-latest
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Buildx 준비
        uses: docker/setup-buildx-action@v3

      - name: 미디어 서버(yt-dlp) 이미지 빌드
        uses: docker/build-push-action@v6
        with:
          context: ./ytdlp_server
          file: ./ytdlp_server/Dockerfile
          push: false
          load: true
          tags: music-lounge-ytdlp:ci
          cache-from: type=gha,scope=media
          cache-to: type=gha,mode=max,scope=media

      - name: 이미지 안 도구 확인
        run: |
          docker run --rm music-lounge-ytdlp:ci python -c "import flask, yt_dlp; print('flask', flask.__version__, '/ yt-dlp', yt_dlp.version.__version__)"
          docker run --rm music-lounge-ytdlp:ci ffmpeg -version | head -1
